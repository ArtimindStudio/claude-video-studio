<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Pix';src:url(fonts/silkscreen.ttf) format('truetype');font-weight:400;}
@font-face{font-family:'Pix';src:url(fonts/silkscreen-bold.ttf) format('truetype');font-weight:700;}
@font-face{font-family:'PixMono';src:url(fonts/pressstart.ttf) format('truetype');}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#000;}
#c{position:absolute;inset:0;width:1080px;height:1920px;image-rendering:pixelated;}
#ui{position:absolute;inset:0;font-family:'Pix',monospace;color:#fff;pointer-events:none;-webkit-font-smoothing:none;font-smooth:never;}
/* hard 8-bit drop shadow + dark outline, no blur */
.sh{text-shadow:-4px 0 0 #17163A,4px 0 0 #17163A,0 -4px 0 #17163A,0 4px 0 #17163A,6px 8px 0 #17163A;}
#hdr{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:'PixMono';font-size:30px;letter-spacing:2px;color:#FFD15C;}
#title{position:absolute;left:0;right:0;top:170px;height:200px;text-align:center;font-weight:700;font-size:112px;letter-spacing:2px;overflow:hidden;white-space:nowrap;color:#FFD15C;}
#title span{display:inline-block;}
/* captions sit high (top band), like the reference: 2-3 lines, key word yellow */
#cap{position:absolute;left:90px;right:90px;top:250px;text-align:center;font-weight:700;font-size:72px;line-height:1.05;letter-spacing:1px;}
#cap span{margin:0 14px;display:inline-block;}
.chip{position:absolute;padding:18px 30px;background:#17163A;color:#fff;font-weight:700;font-size:52px;box-shadow:0 0 0 6px #FFD15C,10px 12px 0 6px rgba(10,10,30,.7);white-space:nowrap;transform-origin:center;}
.chip small{display:block;font-size:26px;font-weight:400;letter-spacing:2px;color:#FFD15C;}
.lab{position:absolute;font-weight:700;font-size:56px;transform:translate(-50%,-50%);white-space:nowrap;}
.lab i{position:absolute;left:-6%;top:52%;height:12px;background:#FFD15C;}
#mid{position:absolute;left:60px;right:60px;text-align:center;font-weight:700;}
.timer{font-family:'PixMono';color:#FFD15C;}
body.land,body.land #c{width:1920px;height:1080px;}
html:has(body.land){width:1920px;height:1080px;}
body.land #cap{left:240px;right:240px;top:860px;font-size:56px;}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/jsm/"}}</script>
<script src="words.js"></script>
</head><body>
<canvas id="c"></canvas>
<canvas id="capc" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:2;pointer-events:none"></canvas>
<div id="ui">
  <div id="hdr" class="sh"></div>
  <div id="title" class="sh"></div>
  <div id="chips"></div>
  <div id="labs"></div>
  <div id="mid" class="sh"></div>
  <div id="cap" class="sh"></div>
</div>
<script type="module">
import { createStage } from './engine.js';
import build, { config } from './scenes.js';
createStage({ words: window.WORDS, ...config }).run(build);
</script></body></html>
