<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fredoka';src:url(fonts/fredoka.woff2) format('woff2');font-weight:300 700;}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#000;}
#c{position:absolute;inset:0;width:1080px;height:1920px;}
#ui{position:absolute;inset:0;font-family:'Fredoka',sans-serif;color:#fff;pointer-events:none;}
.sh{text-shadow:0 4px 0 rgba(30,40,90,.35),0 8px 24px rgba(20,30,80,.35);}
#hdr{position:absolute;left:0;right:0;top:96px;text-align:center;font-weight:600;font-size:34px;letter-spacing:6px;}
#title{position:absolute;left:0;right:0;top:150px;height:200px;text-align:center;font-weight:700;font-size:150px;letter-spacing:4px;overflow:hidden;white-space:nowrap;}
#title span{display:inline-block;}
#cap{position:absolute;left:70px;right:70px;top:1440px;text-align:center;font-weight:600;font-size:76px;line-height:1.15;}
#cap span{margin:0 10px;display:inline-block;}
.chip{position:absolute;padding:18px 34px;border-radius:26px;background:rgba(255,255,255,.92);color:#2B3A67;font-weight:700;font-size:54px;box-shadow:0 10px 0 rgba(43,58,103,.18),0 18px 40px rgba(20,30,80,.25);white-space:nowrap;transform-origin:center;}
.chip small{display:block;font-size:26px;font-weight:500;letter-spacing:3px;color:#7E8AB5;}
.lab{position:absolute;font-weight:700;font-size:66px;transform:translate(-50%,-50%);white-space:nowrap;}
.lab i{position:absolute;left:-6%;top:52%;height:12px;background:#E5484D;border-radius:6px;}
#mid{position:absolute;left:60px;right:60px;text-align:center;font-weight:700;}
/* 16:9 long form (config.format = '16x9') */
body.land,body.land #c{width:1920px;height:1080px;}
html:has(body.land){width:1920px;height:1080px;}
body.land #hdr{top:40px;font-size:26px;}
body.land #title{top:70px;height:150px;font-size:110px;}
body.land #cap{left:240px;right:240px;top:905px;font-size:58px;}
body.land .chip{font-size:44px;padding:14px 28px;}
body.land .chip small{font-size:22px;}
body.land .lab{font-size:48px;}
body.land #mid{left:200px;right:200px;}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/jsm/"}}</script>
<script src="words.js"></script>
</head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hdr" class="sh"></div>
  <div id="title" class="sh"></div>
  <div id="chips"></div>
  <div id="labs"></div>
  <div id="mid" class="sh"></div>
  <div id="cap" class="sh"></div>
</div>
<script type="module">
import { createStage } from './engine.js';
import build, { config } from './scenes.js';
createStage({ words: window.WORDS, ...config }).run(build);
</script></body></html>
