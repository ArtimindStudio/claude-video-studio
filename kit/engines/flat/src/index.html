<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fredoka';src:url(fonts/fredoka.woff2) format('woff2');font-weight:300 700;}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#1B1240;}
#stage{position:absolute;inset:0;width:1080px;height:1920px;}
#ui{position:absolute;inset:0;font-family:'Fredoka',sans-serif;color:#fff;pointer-events:none;}
.sh{text-shadow:0 5px 0 rgba(27,18,64,.55),0 10px 28px rgba(20,10,50,.55);}
#hdr{position:absolute;left:0;right:0;top:118px;text-align:center;font-weight:600;font-size:34px;letter-spacing:5px;color:#FFE3A3;}
#title{position:absolute;left:0;right:0;top:170px;height:200px;text-align:center;font-weight:700;font-size:140px;letter-spacing:3px;overflow:hidden;white-space:nowrap;color:#fff;}
#title span{display:inline-block;}
/* captions: rounded sans, white, gold emphasis, soft shadow; safe zone y 1440-1650 */
#cap{position:absolute;left:80px;right:80px;top:1450px;text-align:center;font-weight:600;font-size:74px;line-height:1.12;}
#cap span{margin:0 9px;display:inline-block;}
.chip{position:absolute;padding:14px 30px 14px 54px;border-radius:999px;background:rgba(27,18,64,.82);border:3px solid #FF6F91;color:#fff;font-weight:600;font-size:38px;letter-spacing:1px;box-shadow:0 10px 26px rgba(11,6,32,.45);white-space:nowrap;transform-origin:center;}
.chip::before{content:'';position:absolute;left:24px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#FF6F91;}
.chip.gold{border-color:#FFC24B;}.chip.gold::before{background:#FFC24B;}
.chip.teal{border-color:#3FD0C9;}.chip.teal::before{background:#3FD0C9;}
.chip small{display:block;font-size:24px;font-weight:500;letter-spacing:3px;color:#C9BFEF;}
#mid{position:absolute;left:60px;right:60px;text-align:center;font-weight:700;}
</style>
<script src="words.js"></script>
</head><body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="sdefs">
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%"><stop offset="55%" stop-color="#0B0620" stop-opacity="0"/><stop offset="100%" stop-color="#0B0620" stop-opacity=".55"/></radialGradient>
  </defs>
  <g id="world"></g>
  <g id="hud"></g>
  <rect width="1080" height="1920" fill="url(#vig)"/>
  <rect width="1080" height="1920" filter="url(#grain)" opacity=".07" style="mix-blend-mode:overlay"/>
</svg>
<div id="ui">
  <div id="hdr" class="sh"></div>
  <div id="title" class="sh"></div>
  <div id="chips"></div>
  <div id="mid" class="sh"></div>
  <div id="cap" class="sh"></div>
</div>
<script type="module">
import { createStage } from './engine.js';
import build, { config } from './scenes.js';
createStage({ words: window.WORDS, ...config }).run(build);
</script></body></html>
